app = "book-forge"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3100"
  STATIC_DIR = "/app/frontend"
  AUTH_BASE_URL = "https://book-forge.fly.dev"
  CLOAK_SIDECAR_URL = "http://127.0.0.1:3102"
  CLOAK_PORT = "3102"

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "2s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
