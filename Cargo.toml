[workspace]
members = [
    "crates/book-forge-converter",
    "crates/book-forge-server",
    "tools/epub-inspector",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
ammonia = "4"
ego-tree = "0.10"
roxmltree = "0.21"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
