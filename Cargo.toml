[workspace]
members = [
    "crates/book-forge-converter",
    "crates/book-forge-server",
    "tools/epub-inspector",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
ammonia = "4"
axum = "0.8"
ego-tree = "0.10"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "charset", "deflate", "gzip", "rustls-tls"] }
roxmltree = "0.21"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
